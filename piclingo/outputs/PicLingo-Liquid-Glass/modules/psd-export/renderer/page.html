<section id="psd-page" class="main-content" aria-label="PSD 出图" hidden>
  <header class="page-header"><div><h1>PSD 出图</h1><p>读取文字图层，使用 Excel 译文批量导出。</p></div><button class="button secondary" id="psd-diagnose">检测 PS</button></header>
  <section class="editor-card glass"><div class="editor-heading"><h2>① 选择 PSD</h2><div><button class="button ghost small-button" id="psd-clear">清空</button><button class="button secondary" id="psd-select">选择文件</button></div></div><p class="settings-hint">支持多个 PSD，也可拖入此页面。</p><div id="psd-files" class="psd-file-list"></div></section>
  <section class="editor-card glass"><div class="editor-heading"><h2>② 导入 Excel</h2><button class="button secondary" id="psd-excel-select">导入 Excel</button></div><p id="psd-excel-path" class="settings-hint">尚未导入</p><label class="psd-field">工作表<select class="psd-input" id="psd-sheet" disabled></select></label><p id="psd-excel-warnings" class="settings-hint" role="status"></p></section>
  <section class="editor-card glass"><div class="editor-heading"><h2>③ 确认匹配</h2><div><select class="psd-input" id="psd-match" aria-label="匹配方式"><option value="source">按英文原文</option><option value="key">按图层 Key</option><option value="manual">手动指定</option></select><button class="button secondary" id="psd-preview">读取匹配</button></div></div><p class="settings-hint" id="psd-match-summary">请选择 PSD 并导入 Excel</p><div class="psd-table-wrap"><table class="psd-table" id="psd-matches"><thead></thead><tbody></tbody></table></div><details><summary>图层信息</summary><pre class="settings-hint" id="psd-layer-tree"></pre></details><details><summary>多余词条</summary><div id="psd-unused" class="settings-hint"></div></details></section>
  <section class="editor-card glass"><div class="editor-heading"><h2>④ 输出设置</h2><button class="button secondary" id="psd-output-select">保存位置</button></div><p id="psd-output-path" class="settings-hint">尚未选择</p><div id="psd-languages" class="psd-languages" role="group" aria-label="输出语言"></div><div class="psd-fields"><label class="psd-field">格式<select id="psd-format" class="psd-input"><option value="png">PNG</option><option value="jpg">JPG</option><option value="psd">PSD</option></select></label><label class="psd-field">命名规则<input id="psd-naming" class="psd-input" value="{文件名}_{语言}"></label><label class="psd-field">JPG 质量<input id="psd-quality" class="psd-input" type="number" min="0" max="100" value="90"></label><label class="psd-field">溢出处理<select id="psd-overflow" class="psd-input"><option value="warn">仅预警</option><option value="shrink">缩小字号</option></select></label><label class="psd-field">最小字号<input id="psd-min-size" class="psd-input" type="number" min="1" max="1000" value="8"></label><label class="psd-field">隐藏图层<select id="psd-hidden" class="psd-input"><option value="skip">跳过</option><option value="include">包含</option></select></label></div><label class="psd-check"><input type="checkbox" id="psd-rtl">RTL 实验</label><p class="settings-hint">阿拉伯语、希伯来语的方向、连字及标点待客户验收。溢出只在结果表中预警，译图文字颜色保留。</p><details><summary>字体设置</summary><p class="settings-hint">按语言填写备用字体的 PostScript 名，使用 JSON 格式。缺失原字体仍按默认规则跳过。</p><textarea id="psd-fonts" class="psd-input" rows="5" aria-label="备用字体配置"></textarea></details><details><summary>PS 设置</summary><label class="psd-field">Mac 应用路径<input id="psd-mac-app" class="psd-input" value="/Applications/Adobe Photoshop 2024/Adobe Photoshop 2024.app"></label><label class="psd-field">Windows COM<input id="psd-progid" class="psd-input" value="Photoshop.Application"></label></details></section>
  <section class="editor-card glass"><div class="editor-heading"><h2>⑤ 开始导出</h2><div><button class="button secondary" id="psd-stop" disabled>停止</button><button class="button primary" id="psd-export" disabled>开始导出</button></div></div><progress id="psd-progress" max="1" value="0" aria-label="出图进度"></progress><p id="psd-status" class="settings-hint" role="status" aria-live="polite">就绪</p><div id="psd-results"></div><div class="dialog-actions"><button class="button ghost" id="psd-open-logs">查看日志</button><button class="button secondary" id="psd-export-logs">导出日志</button><button class="button secondary" id="psd-open-output" disabled>打开目录</button></div></section>
</section>
